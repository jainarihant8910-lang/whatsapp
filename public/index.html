<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>DeliveryOS</title><link rel='stylesheet' href='style.css'><link rel='stylesheet' href='analytics-enhancement.css'></head><body><div id='loginView' class='auth-wrap'><div class='auth-card'><div class='logo'>📦</div><h1>DeliveryOS</h1><p>WhatsApp delivery • Stock • GST invoices</p><div class='tabs'><button id='loginTab' class='active'>Sign in</button><button id='registerTab'>Create business</button></div><form id='loginForm'><label>Firm / Business ID<input id='loginFirm' required autocomplete='username'></label><label>Password<input id='loginPass' type='password' required autocomplete='current-password'></label><button class='primary'>Sign in</button></form><form id='registerForm' class='hidden'><label>Firm ID<input id='regFirm' required></label><label>Business name<input id='regName' required></label><label>Password<input id='regPass' type='password' minlength='8' required></label><button class='primary'>Create business</button><small>Use at least 8 characters. Passwords are stored as salted hashes.</small></form><div id='authMsg' class='msg'></div></div></div><div id='appView' class='hidden'><aside id='side'><div class='brand'><span>📦</span><div><b>DeliveryOS</b><small id='firmLabel'></small></div></div><nav><button data-page='dashboard'>📊 Dashboard</button><button data-page='analytics'>📈 Sales & Profit</button><button data-page='orders'>🚚 Orders</button><button data-page='products'>📦 Products</button><button data-page='customers'>👥 Customers</button><button data-page='senders'>📱 Allowed Numbers</button><button data-page='invoices'>🧾 Invoices</button><button data-page='transactions'>📋 Stock History</button><button data-page='whatsapp'>💬 WhatsApp</button><button data-page='settings'>⚙️ Settings</button></nav><div class='side-bottom'><span id='waMini'>● WhatsApp</span><button id='logout'>Log out</button></div></aside><main><header><button id='menu' class='icon'>☰</button><div><h2 id='title'>Dashboard</h2><p id='subtitle'>Business overview</p></div><button id='refresh' class='icon'>↻</button></header><div id='page'></div></main></div><div id='modal' class='modal hidden'><div class='modal-card'><div class='modal-head'><h3 id='modalTitle'></h3><button id='closeModal'>×</button></div><div id='modalBody'></div></div></div><div id='toast'></div><script src='app.js'></script><script src='analytics-enhancement.js'></script><script src='security-enhancement.js'></script></body></html>
